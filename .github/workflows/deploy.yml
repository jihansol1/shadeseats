name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  S3_BUCKET: shadeseats-hansolji
  CLOUDFRONT_DISTRIBUTION_ID: E2XWJ9R2X5RS86

jobs:
  verify-and-deploy:
    name: Verify and deploy static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run verification checks
        run: npm run verify

      - name: Debug OIDC claims
        run: |
          TOKEN_JSON=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d "." -f2)
          PAYLOAD="$PAYLOAD" node -e "const payload = JSON.parse(Buffer.from(process.env.PAYLOAD, 'base64url').toString()); console.log(JSON.stringify({ aud: payload.aud, sub: payload.sub, repository: payload.repository, ref: payload.ref, job_workflow_ref: payload.job_workflow_ref }, null, 2));"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::584903217072:role/shadeseats-static-site-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static files to S3
        run: |
          aws s3 sync . "s3://${S3_BUCKET}" --delete \
            --exclude "*" \
            --include "index.html" \
            --include "styles.css" \
            --include "src/*" \
            --include "data/*" \
            --include "docs/screenshots/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
